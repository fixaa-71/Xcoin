<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="darkCore" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1f242d"/>
      <stop offset="70%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring Shadow -->
  <circle cx="256" cy="256" r="236" fill="url(#metalRim)" filter="url(#shadow)"/>
  
  <!-- Outer Bevel Edge -->
  <circle cx="256" cy="256" r="224" fill="#0b0e14" stroke="url(#metalRim)" stroke-width="4"/>

  <!-- Inner Textured Gold Gear Ridge -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#metalRim)" stroke-width="12" stroke-dasharray="8 6"/>

  <!-- Obsidian Deep Mirror Core -->
  <circle cx="256" cy="256" r="196" fill="url(#darkCore)" stroke="url(#metalRim)" stroke-width="5"/>

  <!-- Subtle Concentric Tech Rings -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="12 18"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Stylized Metallic 3D "X" Logo -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Back Glow -->
    <path d="M-80 -95 L-20 -95 L0 -65 L20 -95 L80 -95 L25 -15 L85 95 L25 95 L0 60 L-25 95 L-85 95 L-25 -15 Z" 
          fill="none" stroke="#f59e0b" stroke-width="16" stroke-opacity="0.4" filter="blur(6px)"/>
    
    <!-- Left-to-Right Stroke -->
    <polygon points="-80,-95 -45,-95 80,95 45,95" fill="url(#metalRim)"/>
    <polygon points="-75,-95 -45,-95 80,95 50,95" fill="url(#goldGlow)" opacity="0.85"/>

    <!-- Right-to-Left Stroke (Interlocking 3D) -->
    <polygon points="80,-95 45,-95 -80,95 -45,95" fill="url(#metalRim)"/>
    <polygon points="75,-95 45,-95 -80,95 -50,95" fill="url(#goldGlow)" opacity="0.75"/>
    
    <!-- Central Jewel Facet -->
    <polygon points="0,-25 22,0 0,25 -22,0" fill="#fffbeb" opacity="0.95"/>
    <polygon points="0,-18 16,0 0,18 -16,0" fill="url(#goldGlow)"/>
  </g>

  <!-- Currency Text Engraving -->
  <path id="textPathTop" d="M 120 256 A 136 136 0 0 1 392 256" fill="none"/>
  <path id="textPathBottom" d="M 392 256 A 136 136 0 0 1 120 256" fill="none"/>
  
  <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#fef08a" letter-spacing="6">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      X COIN NETWORK
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="19" fill="#f59e0b" letter-spacing="8" opacity="0.85">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      PROVABLY AUTHENTIC
    </textPath>
  </text>
</svg>
